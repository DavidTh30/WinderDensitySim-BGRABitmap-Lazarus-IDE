<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Tahoma, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">ลำดับการคำนวณของแบบจำลอง (Model calculation chain)</text>

  <!-- inputs -->
  <rect x="20" y="55" width="200" height="190" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="120" y="78" text-anchor="middle" font-weight="bold" fill="#1d4ed8">INPUT</text>
  <text x="32" y="102" fill="#0f172a">ฟิล์ม: t, W, L, ρf, E, σy</text>
  <text x="32" y="122" fill="#0f172a">ผิว: Rq, μ (COF)</text>
  <text x="32" y="142" fill="#0f172a">เครื่อง: D0, Dc, Er, ν</text>
  <text x="32" y="162" fill="#0f172a">กระบวนการ: V, Tw0, kT</text>
  <text x="32" y="182" fill="#0f172a">แรงกด: N0, kN</text>
  <text x="32" y="202" fill="#0f172a">ค่าคงที่: μair, Patm,</text>
  <text x="32" y="222" fill="#0f172a">Kn, α, Pasp</text>

  <!-- step (per layer) -->
  <rect x="250" y="55" width="330" height="330" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="415" y="76" text-anchor="middle" font-weight="bold" fill="#334155">Step(dt) → AddLayer  (ทุกรอบที่ม้วนครบ 1 ชั้น)</text>
  <rect x="270" y="90" width="290" height="44" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="282" y="108" font-weight="bold" fill="#0e7490">1  แรงตึง taper</text>
  <text x="282" y="126" fill="#0f172a">Tw(R) = Tw0·[1 − kT·(1 − R0/R)]</text>
  <rect x="270" y="142" width="290" height="44" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="282" y="160" font-weight="bold" fill="#0e7490">2  แรงกด nip</text>
  <text x="282" y="178" fill="#0f172a">N(R) = N0·[1 − kN·(1 − R0/R)]</text>
  <rect x="270" y="194" width="290" height="44" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="282" y="212" font-weight="bold" fill="#0e7490">3  Wound-in-tension</text>
  <text x="282" y="230" fill="#0f172a">WIT = Tw + μ·N</text>
  <rect x="270" y="246" width="290" height="62" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="282" y="264" font-weight="bold" fill="#c2410c">4  อากาศที่ติดเข้าไป (air entrainment)</text>
  <text x="282" y="282" fill="#0f172a">h0 = 0.643·Req·(12·μair·U/(Tw+N))^(2/3)</text>
  <text x="282" y="300" fill="#0f172a">hn = Kn·h0 ;  ha = max(0, hn − 3Rq)</text>
  <rect x="270" y="316" width="290" height="56" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="282" y="334" font-weight="bold" fill="#334155">เก็บชั้น TLayer</text>
  <text x="282" y="352" fill="#0f172a">R, LCum, Tw, Nip, WIT, HAir</text>
  <text x="282" y="368" fill="#64748b" font-size="12">R(i+1) = R(i) + t + ha + 2Rq  (as-wound)</text>

  <!-- solve -->
  <rect x="610" y="55" width="330" height="270" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="775" y="76" text-anchor="middle" font-weight="bold" fill="#334155">Solve  (ทุกชั้นพร้อมกัน หลังทุก Step)</text>
  <rect x="630" y="90" width="290" height="62" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="642" y="108" font-weight="bold" fill="#b91c1c">5  แรงดันระหว่างชั้น (นอก → ใน)</text>
  <text x="642" y="126" fill="#0f172a">P(i) = α · Σ(j&gt;i) WIT(j) / (R(j) + t/2)</text>
  <text x="642" y="144" fill="#64748b" font-size="12">ชั้นนอกสุด P = 0, แกนรับแรงดันมากสุด</text>
  <rect x="630" y="160" width="290" height="62" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="642" y="178" font-weight="bold" fill="#b91c1c">6  ช่องว่างถูกบีบ</text>
  <text x="642" y="196" fill="#0f172a">gap = ha·Patm/(Patm+P)</text>
  <text x="642" y="214" fill="#0f172a">      + 2Rq·exp(−P/Pasp)</text>
  <rect x="630" y="230" width="290" height="80" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="642" y="248" font-weight="bold" fill="#6d28d9">7  ความหนาแน่น</text>
  <text x="642" y="266" fill="#0f172a">k(i) = t/(t + gap(i)) ;  ρ(i) = k(i)·ρf</text>
  <text x="642" y="284" fill="#0f172a">Rc(i) = √(R0² + Σ ℓ(j)·(t+gap(j))/π)</text>
  <text x="642" y="302" fill="#0f172a">k_avg = L·t / (π·(Rout² − R0²))</text>

  <!-- outputs -->
  <rect x="610" y="350" width="330" height="140" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="775" y="372" text-anchor="middle" font-weight="bold" fill="#15803d">OUTPUT</text>
  <text x="626" y="396" fill="#0f172a">• ρ(r), P(r), k_avg, ρ_avg, k_min, k_outer</text>
  <text x="626" y="416" fill="#0f172a">• Ø ม้วนจริง vs Ø ideal, จำนวนชั้น</text>
  <text x="626" y="436" fill="#0f172a">• rpm, แรงบิด, กำลัง, มวล, เวลา</text>
  <text x="626" y="456" fill="#0f172a">• NIP: 2b, Pmax (Hertz)</text>
  <text x="626" y="476" fill="#0f172a">• คำเตือน (GetWarnings)</text>

  <rect x="250" y="410" width="330" height="80" rx="8" fill="#fefce8" stroke="#eab308"/>
  <text x="415" y="432" text-anchor="middle" font-weight="bold" fill="#a16207">แสดงผล (BGRABitmap)</text>
  <text x="266" y="456" fill="#0f172a">RenderScene: เครื่อง + KPI + กราฟ 4 รูป</text>
  <text x="266" y="476" fill="#0f172a">TfrmDev: Live data / Layer table / Export</text>

  <path d="M220,150 L268,112" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M415,134 L415,142" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M415,186 L415,194" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M415,238 L415,246" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M415,308 L415,316" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M560,344 C600,344 590,121 628,121" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M775,152 L775,160" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M775,222 L775,230" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M775,310 L775,348" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M608,450 L582,450" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="20" y="520" width="920" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="544" font-weight="bold" fill="#334155">หมายเหตุ</text>
  <text x="36" y="566" fill="#0f172a">• ทุกหน่วยภายในแบบจำลองเป็น SI (m, N, Pa, s, kg) แรงตึงและแรงกดคิดต่อความกว้าง 1 m (N/m)</text>
  <text x="36" y="586" fill="#0f172a">• Kn, α, Pasp เป็นค่าคงที่เชิงประสบการณ์ (empirical) ต้องปรับเทียบกับม้วนจริง (วัด Ø และชั่งน้ำหนัก)</text>
  <text x="36" y="606" fill="#0f172a">• Solve คำนวณใหม่ทั้งม้วนทุกครั้ง (O(n), n ≈ 10,000–40,000 ชั้น) จึงเห็นผลชั้นนอกบีบชั้นในแบบ real time</text>
</svg>
